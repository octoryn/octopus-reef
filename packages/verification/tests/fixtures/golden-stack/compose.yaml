services:
  database:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: golden
      POSTGRES_USER: golden
      POSTGRES_PASSWORD: golden-local-only
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U golden -d golden"]
      interval: 2s
      timeout: 2s
      retries: 30
  migration:
    image: postgres:16-alpine
    depends_on:
      database:
        condition: service_healthy
    environment:
      PGPASSWORD: golden-local-only
    volumes:
      - ./backend/migrations:/migrations:ro
    command: ["sh", "-c", "psql -h database -U golden -d golden -f /migrations/001_health.sql && psql -h database -U golden -d golden -f /migrations/001_health.sql"]
  backend:
    build: ./backend
    depends_on:
      migration:
        condition: service_completed_successfully
    environment:
      DATABASE_URL: postgresql://golden:golden-local-only@database:5432/golden
    ports:
      - "127.0.0.1::8000"
  frontend:
    build: ./frontend
    depends_on:
      backend:
        condition: service_started
    ports:
      - "127.0.0.1::3000"
