name: release

# Publishing is deliberate: it runs only when a maintainer pushes a version tag
# AND an NPM_TOKEN secret is configured. Nothing publishes on ordinary pushes.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          registry-url: "https://registry.npmjs.org"
      - run: npm ci
      - run: npm run verify:all
      - run: npm run release:smoke
      - name: publish public beta packages
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          set -euo pipefail
          for pkg in \
            protocol \
            engine \
            driver-claude \
            agent \
            adapter-runtime \
            adapter-observe \
            adapter-blackboard \
            adapter-experience \
            adapter-scout
          do
            npm publish --access public --provenance --workspace "@octopus-reef/$pkg"
          done
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          PKG_VERSION="$(node -p 'require("./package.json").version')"
          gh release create "$GITHUB_REF_NAME" \
            --title "$GITHUB_REF_NAME" \
            --notes "Published Reef ${PKG_VERSION} public beta workspace packages to npm with provenance."
