name: control-plane-release

on:
  push:
    tags: ["control-plane-v*"]

permissions:
  contents: write
  id-token: write
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          registry-url: "https://registry.npmjs.org"
          cache: npm
      - name: Verify immutable release version
        id: version
        shell: bash
        run: |
          set -euo pipefail
          VERSION="$(node -p 'require("./packages/control-plane/package.json").version')"
          test "$GITHUB_REF_NAME" = "control-plane-v$VERSION"
          if npm view "@octopus-reef/control-plane@$VERSION" version >/dev/null 2>&1; then
            echo "npm version already exists; refusing to replace an immutable release" >&2
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
      - run: npm ci
      - run: npm run verify:all
      - run: npm pack --dry-run --workspace @octopus-reef/control-plane
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Refuse to replace an existing image tag
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          if docker manifest inspect "ghcr.io/${GITHUB_REPOSITORY_OWNER}/octopus-reef-control-plane:${VERSION}" >/dev/null 2>&1; then
            echo "image tag already exists; refusing to replace an immutable release" >&2
            exit 1
          fi
      - name: Publish npm package with provenance
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: npm publish --access public --provenance --workspace @octopus-reef/control-plane
      - name: Build and publish service image
        id: image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: packages/control-plane/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/octopus-reef-control-plane:${{ steps.version.outputs.version }}
            ghcr.io/${{ github.repository_owner }}/octopus-reef-control-plane:sha-${{ github.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ steps.version.outputs.version }}
            org.opencontainers.image.licenses=Apache-2.0
      - name: Create immutable GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
          IMAGE_DIGEST: ${{ steps.image.outputs.digest }}
        run: |
          cat > "$RUNNER_TEMP/release-notes.md" <<EOF
          Published @octopus-reef/control-plane ${VERSION} to npm with provenance.

          Service image (pin this immutable digest):

          \`ghcr.io/${GITHUB_REPOSITORY_OWNER}/octopus-reef-control-plane@${IMAGE_DIGEST}\`

          Supported entrypoint: \`reef-control-plane serve\` (the image uses it by default).
          EOF
          gh release create "$GITHUB_REF_NAME" \
            --title "@octopus-reef/control-plane ${VERSION}" \
            --notes-file "$RUNNER_TEMP/release-notes.md" \
            --verify-tag
