name: deterministic-verification-release

on:
  workflow_dispatch:
    inputs:
      recover_immutable_0_3_0:
        description: Recover publication without moving the existing immutable 0.3.0 tag
        required: false
        default: false
        type: boolean
  push:
    tags: ["control-plane-v0.3.0"]

permissions:
  contents: write
  packages: write
  id-token: write
  security-events: write

concurrency:
  group: deterministic-verification-0.3.0-${{ github.ref }}
  cancel-in-progress: false

env:
  VERSION: 0.3.0
  RELEASE_TAG: control-plane-v0.3.0
  RELEASE_COMMIT: ${{ inputs.recover_immutable_0_3_0 && 'e75f5bdb2c81e0d72be88b9830a24d59f8cd509c' || github.sha }}
  RECOVERY_MODE: ${{ github.event_name == 'workflow_dispatch' && inputs.recover_immutable_0_3_0 && 'true' || 'false' }}
  API_REPOSITORY: ghcr.io/${{ github.repository_owner }}/octopus-reef-verification-api
  WORKER_REPOSITORY: ghcr.io/${{ github.repository_owner }}/octopus-reef-verification-worker
  PROFILE_REPOSITORY: ghcr.io/${{ github.repository_owner }}/octopus-reef-verification-golden-stack

jobs:
  preflight:
    name: irreversible-publish preflight
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: reef_verification
          POSTGRES_USER: reef_verification
          POSTGRES_PASSWORD: reef-verification-release-test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U reef_verification -d reef_verification"
          --health-interval 2s
          --health-timeout 2s
          --health-retries 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ inputs.recover_immutable_0_3_0 && env.RELEASE_TAG || github.ref }}
      - uses: actions/setup-node@v4
        with:
          node-version: "22.17.1"
          registry-url: https://registry.npmjs.org
          cache: npm
      - uses: docker/setup-buildx-action@v3
      - uses: docker/setup-qemu-action@v3

      - name: Prove exact release identity and unused immutable names
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if [[ "$GITHUB_REF" == refs/tags/* || "$RECOVERY_MODE" == true ]]; then
            if [[ "$GITHUB_REF" == refs/tags/* ]]; then
              test "$GITHUB_REF_NAME" = "$RELEASE_TAG"
            fi
            test "$(git rev-parse HEAD)" = "$RELEASE_COMMIT"
            gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/${RELEASE_TAG}" > release-tag-ref.json
            test "$(jq -r '.object.type' release-tag-ref.json)" = tag
            tag_object="$(jq -r '.object.sha' release-tag-ref.json)"
            gh api "repos/${GITHUB_REPOSITORY}/git/tags/${tag_object}" > release-tag-object.json
            test "$(jq -r '.object.type' release-tag-object.json)" = commit
            test "$(jq -r '.object.sha' release-tag-object.json)" = "$RELEASE_COMMIT"
          else
            test "$GITHUB_EVENT_NAME" = workflow_dispatch
            ! git show-ref --verify --quiet "refs/tags/${RELEASE_TAG}"
          fi
          test "$(node -p 'require("./packages/control-plane/package.json").version')" = "$VERSION"
          test "$(node -p 'require("./packages/verification/package.json").version')" = "$VERSION"
          test "$(node -p 'require("./packages/control-plane/package.json").dependencies["@octopus-reef/verification"]')" = "$VERSION"
          test "$(gh api "repos/${GITHUB_REPOSITORY}" --jq '.visibility')" = "public"
          for package in @octopus-reef/control-plane @octopus-reef/verification; do
            if npm view "${package}@${VERSION}" --json > existing-package.json 2>/dev/null; then
              test "$(jq -r '.gitHead' existing-package.json)" = "$RELEASE_COMMIT"
            fi
          done
          release_tag="$RELEASE_TAG"
          if gh release view "$release_tag" --json tagName > existing-release.json 2>/dev/null; then
            test "$(jq -r '.tagName' existing-release.json)" = "$release_tag"
            test "$RECOVERY_MODE" = true || test "$GITHUB_REF" = "refs/tags/${release_tag}"
          fi
          for repository in "$API_REPOSITORY" "$WORKER_REPOSITORY" "$PROFILE_REPOSITORY"; do
            if version_digest="$(docker buildx imagetools inspect "${repository}:${VERSION}" --format '{{.Manifest.Digest}}' 2>/dev/null)"; then
              commit_digest="$(docker buildx imagetools inspect "${repository}:sha-${RELEASE_COMMIT}" --format '{{.Manifest.Digest}}')"
              test "$version_digest" = "$commit_digest"
            fi
          done

      - name: Require a report-only release authorization commit
        run: |
          set -euo pipefail
          report=release/verification-0.3.0/candidate-report.json
          test -f "$report"
          test "$(git rev-parse HEAD)" = "$RELEASE_COMMIT"
          implementation_commit="$(git rev-parse "${RELEASE_COMMIT}^")"
          test "$(git diff --name-only "$implementation_commit" "$RELEASE_COMMIT" | wc -l | tr -d ' ')" = 1
          test "$(git diff --name-only "$implementation_commit" "$RELEASE_COMMIT")" = "$report"
          jq -e --arg sha "$implementation_commit" '
            .schemaVersion == "reef.verification-candidate-report.v1" and
            .decision == "READY_FOR_INDEPENDENT_AUDIT" and
            .implementationCommit == $sha and
            (.prepublishGates.passed == true) and
            (.realPostgresTests.passed == true) and
            (.isolatedDockerTests.passed == true) and
            (.cleanPackageInstall.passed == true) and
            (.knownUnverified | type == "array")
          ' "$report"

      - name: Install the locked tree and build the one required native test binding
        run: |
          set -euo pipefail
          npm ci --ignore-scripts
          npm rebuild better-sqlite3
      - name: Full source, package and high-severity dependency gate
        run: |
          set -euo pipefail
          npm run verify:all
          node scripts/verification-prepublish-gate.mjs | tee verification-package-gate.json
          jq -e '.cleanInstall == true' verification-package-gate.json
          npm audit --audit-level=high
          npm audit signatures

      - name: Real PostgreSQL and isolated Golden Stack Worker gate
        env:
          REEF_TEST_POSTGRES_URL: postgresql://reef_verification:reef-verification-release-test@127.0.0.1:5432/reef_verification
        run: |
          set -euo pipefail
          fixture=packages/verification/tests/fixtures/golden-stack
          docker build -f "$fixture/Dockerfile.sandbox" -t reef-verification-golden-stack:preflight "$fixture"
          docker buildx build --platform linux/arm64 --load \
            -f "$fixture/Dockerfile.sandbox" \
            -t reef-verification-golden-stack:preflight-arm64 \
            "$fixture"
          export REEF_TEST_DOCKER_IMAGE
          REEF_TEST_DOCKER_IMAGE="$(docker image inspect reef-verification-golden-stack:preflight --format '{{.Id}}')"
          npm test --workspace @octopus-reef/verification -- --test-concurrency=1

      - name: Real generated Next.js, FastAPI, PostgreSQL Docker Compose gate
        run: |
          set -euo pipefail
          compose=packages/verification/tests/fixtures/golden-stack/compose.yaml
          cleanup() {
            docker compose -p reef-verification-golden-compose -f "$compose" down --volumes --remove-orphans
          }
          trap cleanup EXIT
          docker compose -p reef-verification-golden-compose -f "$compose" up --build --detach --wait
          backend_port="$(docker compose -p reef-verification-golden-compose -f "$compose" port backend 8000 | sed 's/.*://')"
          frontend_port="$(docker compose -p reef-verification-golden-compose -f "$compose" port frontend 3000 | sed 's/.*://')"
          curl --fail --silent "http://127.0.0.1:${backend_port}/health" | jq -e '.status == "ready" and .component == "backend"'
          curl --fail --silent "http://127.0.0.1:${frontend_port}/api/health" | jq -e '.status == "ready" and .component == "frontend"'
          docker compose -p reef-verification-golden-compose -f "$compose" ps migration --all --format json | jq -e '
            (if type == "array" then . else [.] end) |
            (length == 1) and
            (.[0].Service == "migration") and
            (.[0].ExitCode == 0)
          '

      - name: Build and smoke immutable API and Worker targets before publication
        env:
          REEF_VERIFICATION_DATABASE_URL: postgresql://reef_verification:reef-verification-release-test@127.0.0.1:5432/reef_verification
        run: |
          set -euo pipefail
          docker build --target api -f packages/verification/Dockerfile -t reef-verification-api:preflight .
          docker build --target worker -f packages/verification/Dockerfile -t reef-verification-worker:preflight .
          docker build \
            --build-arg REEF_VERIFICATION_API_IMAGE=reef-verification-api:preflight \
            -f packages/verification/Dockerfile.remote-sandbox \
            -t reef-verification-remote-sandbox:preflight \
            .
          docker buildx build --platform linux/arm64 --load \
            --target api \
            -f packages/verification/Dockerfile \
            -t reef-verification-api:preflight-arm64 \
            .
          docker buildx build --platform linux/arm64 --load \
            --target worker \
            -f packages/verification/Dockerfile \
            -t reef-verification-worker:preflight-arm64 \
            .
          docker build --platform linux/arm64 \
            --build-arg REEF_VERIFICATION_API_IMAGE=reef-verification-api:preflight-arm64 \
            -f packages/verification/Dockerfile.remote-sandbox \
            -t reef-verification-remote-sandbox:preflight-arm64 \
            .
          docker run --rm \
            --network host \
            --env REEF_VERIFICATION_DATABASE_URL \
            --env REEF_VERIFICATION_DATABASE_SSL_MODE=disable \
            reef-verification-api:preflight migrate
          docker run --rm reef-verification-api:preflight help | grep -F 'api|worker|migrate'
          docker run --rm reef-verification-worker:preflight help | grep -F 'api|worker|migrate'
          for image in reef-verification-api:preflight reef-verification-worker:preflight \
            reef-verification-api:preflight-arm64 reef-verification-worker:preflight-arm64; do
            docker run --rm --entrypoint sh "$image" -c '
              ! command -v npm &&
              ! command -v npx &&
              ! command -v tsc &&
              ! command -v gcc &&
              ! command -v make &&
              test ! -d /usr/local/lib/node_modules/npm &&
              test ! -d /app/node_modules/typescript
            '
          done
          test "$(docker image inspect reef-verification-api:preflight --format '{{.Config.User}}')" = node
          test "$(docker image inspect reef-verification-worker:preflight --format '{{.Config.User}}')" = node
          test "$(docker image inspect reef-verification-remote-sandbox:preflight --format '{{.Config.User}}')" = node
          docker run --detach --name reef-verification-remote-smoke \
            --env REEF_VERIFICATION_SANDBOX_AUTH_TOKEN=reef-verification-preflight-token-000000000000 \
            reef-verification-remote-sandbox:preflight
          for attempt in $(seq 1 30); do
            health="$(docker inspect reef-verification-remote-smoke --format '{{.State.Health.Status}}')"
            test "$health" != unhealthy
            if test "$health" = healthy; then
              break
            fi
            test "$attempt" -lt 30
            sleep 1
          done
          docker exec reef-verification-remote-smoke node -e "
            fetch('http://127.0.0.1:8081/readyz')
              .then(response => response.json())
              .then(body => process.exit(body.ready === true && body.service === 'reef-verification-sandbox' ? 0 : 1))
              .catch(() => process.exit(1))
          "
          docker rm --force reef-verification-remote-smoke

          smoke_root="$(mktemp -d "${RUNNER_TEMP}/reef-verification-smoke.XXXXXX")"
          chmod 0777 "$smoke_root"
          cleanup() {
            docker rm --force reef-verification-api-smoke reef-verification-pg17 >/dev/null 2>&1 || true
            rm -rf "$smoke_root"
          }
          trap cleanup EXIT
          docker run --detach --name reef-verification-api-smoke \
            --network host \
            --mount "type=bind,src=${GITHUB_WORKSPACE}/packages/verification/tests/fixtures/release-smoke/profiles.json,dst=/config/profiles.json,readonly" \
            --mount "type=bind,src=${GITHUB_WORKSPACE}/packages/verification/tests/fixtures/release-smoke/workload-jwks.json,dst=/config/workload-jwks.json,readonly" \
            --mount "type=bind,src=${smoke_root},dst=/data" \
            --env REEF_VERIFICATION_DATABASE_URL \
            --env REEF_VERIFICATION_DATABASE_SSL_MODE=disable \
            --env REEF_VERIFICATION_PROFILES_FILE=/config/profiles.json \
            --env REEF_VERIFICATION_WORKLOAD_JWKS_FILE=/config/workload-jwks.json \
            --env REEF_VERIFICATION_WORKLOAD_ISSUER=release-smoke \
            --env REEF_VERIFICATION_WORKLOAD_AUDIENCE=release-smoke \
            --env REEF_VERIFICATION_OBJECT_STORE=local \
            --env REEF_VERIFICATION_ALLOW_LOCAL_STORAGE=true \
            --env REEF_VERIFICATION_DATA_ROOT=/data \
            reef-verification-api:preflight
          curl --fail --silent --show-error \
            --retry 20 --retry-all-errors --retry-delay 1 \
            http://127.0.0.1:8080/health/live | jq -e '.status == "live"'
          curl --fail --silent --show-error \
            http://127.0.0.1:8080/health/ready | jq -e '.status == "ready"'
          docker run --rm --network host \
            --mount "type=bind,src=${GITHUB_WORKSPACE}/packages/verification/tests/fixtures/release-smoke/profiles.json,dst=/config/profiles.json,readonly" \
            --mount "type=bind,src=${smoke_root},dst=/data" \
            --env REEF_VERIFICATION_DATABASE_URL \
            --env REEF_VERIFICATION_DATABASE_SSL_MODE=disable \
            --env REEF_VERIFICATION_PROFILES_FILE=/config/profiles.json \
            --env REEF_VERIFICATION_OBJECT_STORE=local \
            --env REEF_VERIFICATION_ALLOW_LOCAL_STORAGE=true \
            --env REEF_VERIFICATION_DATA_ROOT=/data \
            --env REEF_VERIFICATION_SECRET_RESOLVER=env \
            --env REEF_VERIFICATION_ALLOW_ENV_SECRETS=true \
            --env REEF_VERIFICATION_SANDBOX_ADAPTER=local \
            --env REEF_VERIFICATION_ALLOW_UNSAFE_LOCAL_SANDBOX=true \
            --env REEF_VERIFICATION_WORKSPACE_ROOT=/data/workspaces \
            --env REEF_VERIFICATION_WORKER_ONCE=true \
            reef-verification-worker:preflight

          docker run --detach --name reef-verification-pg17 \
            --publish 127.0.0.1:5433:5432 \
            --env POSTGRES_DB=reef_verification \
            --env POSTGRES_USER=reef_verification \
            --env POSTGRES_PASSWORD=reef-verification-release-test \
            postgres:17-alpine
          for attempt in $(seq 1 30); do
            if docker exec reef-verification-pg17 \
              pg_isready -U reef_verification -d reef_verification; then
              break
            fi
            test "$attempt" -lt 30
            sleep 1
          done
          pg17_url=postgresql://reef_verification:reef-verification-release-test@127.0.0.1:5433/reef_verification
          docker run --rm --network host \
            --env "REEF_VERIFICATION_DATABASE_URL=${pg17_url}" \
            --env REEF_VERIFICATION_DATABASE_SSL_MODE=disable \
            reef-verification-api:preflight migrate
          docker run --rm --network host \
            --env "REEF_VERIFICATION_DATABASE_URL=${pg17_url}" \
            --env REEF_VERIFICATION_DATABASE_SSL_MODE=disable \
            reef-verification-api:preflight migrate
          REEF_TEST_POSTGRES_URL="$pg17_url" \
            node --import tsx --test packages/verification/tests/postgres.integration.test.ts
          docker restart reef-verification-pg17
          for attempt in $(seq 1 30); do
            if docker exec reef-verification-pg17 \
              pg_isready -U reef_verification -d reef_verification; then
              break
            fi
            test "$attempt" -lt 30
            sleep 1
          done
          docker run --rm --network host \
            --env "REEF_VERIFICATION_DATABASE_URL=${pg17_url}" \
            --env REEF_VERIFICATION_DATABASE_SSL_MODE=disable \
            reef-verification-api:preflight migrate
          test "$(docker exec reef-verification-pg17 psql \
            --username reef_verification \
            --dbname reef_verification \
            --tuples-only --no-align \
            --command "select indexdef from pg_indexes where indexname='verification_queue_claim_idx'")" = \
            "CREATE INDEX verification_queue_claim_idx ON public.verification_queue USING btree (available_at, created_at)"

      - name: Scan source tree and preflight images before any publish
        uses: aquasecurity/trivy-action@a9c7b0f06e461e9d4b4d1711f154ee024b8d7ab8 # v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln,secret
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          format: json
          output: preflight-source.trivy.json
          exit-code: "1"
      - name: Scan API image before any publish
        uses: aquasecurity/trivy-action@a9c7b0f06e461e9d4b4d1711f154ee024b8d7ab8 # v0.36.0
        with:
          image-ref: reef-verification-api:preflight
          scanners: vuln,secret
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          format: json
          output: preflight-api.trivy.json
          exit-code: "1"
      - name: Scan arm64 API image before any publish
        uses: aquasecurity/trivy-action@a9c7b0f06e461e9d4b4d1711f154ee024b8d7ab8 # v0.36.0
        with:
          image-ref: reef-verification-api:preflight-arm64
          scanners: vuln,secret
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          format: json
          output: preflight-api-arm64.trivy.json
          exit-code: "1"
      - name: Scan Worker image before any publish
        uses: aquasecurity/trivy-action@a9c7b0f06e461e9d4b4d1711f154ee024b8d7ab8 # v0.36.0
        with:
          image-ref: reef-verification-worker:preflight
          scanners: vuln,secret
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          format: json
          output: preflight-worker.trivy.json
          exit-code: "1"
      - name: Scan arm64 Worker image before any publish
        uses: aquasecurity/trivy-action@a9c7b0f06e461e9d4b4d1711f154ee024b8d7ab8 # v0.36.0
        with:
          image-ref: reef-verification-worker:preflight-arm64
          scanners: vuln,secret
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          format: json
          output: preflight-worker-arm64.trivy.json
          exit-code: "1"
      - name: Scan Golden Stack sandbox before any publish
        uses: aquasecurity/trivy-action@a9c7b0f06e461e9d4b4d1711f154ee024b8d7ab8 # v0.36.0
        with:
          image-ref: reef-verification-golden-stack:preflight
          scanners: vuln,secret
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          format: json
          output: preflight-golden.trivy.json
          exit-code: "1"
      - name: Scan arm64 Golden Stack sandbox before any publish
        uses: aquasecurity/trivy-action@a9c7b0f06e461e9d4b4d1711f154ee024b8d7ab8 # v0.36.0
        with:
          image-ref: reef-verification-golden-stack:preflight-arm64
          scanners: vuln,secret
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          format: json
          output: preflight-golden-arm64.trivy.json
          exit-code: "1"
      - name: Scan remote Golden Stack sandbox before any publish
        uses: aquasecurity/trivy-action@a9c7b0f06e461e9d4b4d1711f154ee024b8d7ab8 # v0.36.0
        with:
          image-ref: reef-verification-remote-sandbox:preflight
          scanners: vuln,secret
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          format: json
          output: preflight-remote-golden.trivy.json
          exit-code: "1"
      - name: Scan arm64 remote Golden Stack sandbox before any publish
        uses: aquasecurity/trivy-action@a9c7b0f06e461e9d4b4d1711f154ee024b8d7ab8 # v0.36.0
        with:
          image-ref: reef-verification-remote-sandbox:preflight-arm64
          scanners: vuln,secret
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          format: json
          output: preflight-remote-golden-arm64.trivy.json
          exit-code: "1"

      - name: Generate pre-publish API image SBOM
        uses: anchore/sbom-action@v0
        with:
          image: reef-verification-api:preflight
          format: cyclonedx-json
          output-file: preflight-api-image.cdx.json
      - name: Generate pre-publish arm64 API image SBOM
        uses: anchore/sbom-action@v0
        with:
          image: reef-verification-api:preflight-arm64
          format: cyclonedx-json
          output-file: preflight-api-arm64-image.cdx.json
      - name: Generate pre-publish Worker image SBOM
        uses: anchore/sbom-action@v0
        with:
          image: reef-verification-worker:preflight
          format: cyclonedx-json
          output-file: preflight-worker-image.cdx.json
      - name: Generate pre-publish arm64 Worker image SBOM
        uses: anchore/sbom-action@v0
        with:
          image: reef-verification-worker:preflight-arm64
          format: cyclonedx-json
          output-file: preflight-worker-arm64-image.cdx.json
      - name: Generate pre-publish Golden image SBOM
        uses: anchore/sbom-action@v0
        with:
          image: reef-verification-remote-sandbox:preflight
          format: cyclonedx-json
          output-file: preflight-golden-image.cdx.json
      - name: Generate pre-publish arm64 Golden image SBOM
        uses: anchore/sbom-action@v0
        with:
          image: reef-verification-remote-sandbox:preflight-arm64
          format: cyclonedx-json
          output-file: preflight-golden-arm64-image.cdx.json

      - name: Generate package SBOMs and digest-bound preflight record
        run: |
          set -euo pipefail
          npm sbom --workspace @octopus-reef/verification --sbom-format cyclonedx > verification-package.cdx.json
          npm sbom --workspace @octopus-reef/control-plane --sbom-format cyclonedx > control-plane-package.cdx.json
          cp release/verification-0.3.0/candidate-report.json candidate-report.json
          jq -n \
            --slurpfile candidate candidate-report.json \
            --slurpfile packageGate verification-package-gate.json \
            '{
              schemaVersion: "reef.verification-preflight-summary.v1",
              gitCommit: env.RELEASE_COMMIT,
              sourceTests: $candidate[0].prepublishGates.fullSourceTests,
              postgres: $candidate[0].realPostgresTests,
              docker: $candidate[0].isolatedDockerTests,
              packageGate: $packageGate[0],
              result: "passed"
            }' > preflight-test-summary.json
          sha256sum \
            verification-package-gate.json \
            verification-package.cdx.json \
            control-plane-package.cdx.json \
            preflight-api-image.cdx.json \
            preflight-api-arm64-image.cdx.json \
            preflight-worker-image.cdx.json \
            preflight-worker-arm64-image.cdx.json \
            preflight-golden-image.cdx.json \
            preflight-golden-arm64-image.cdx.json \
            preflight-source.trivy.json \
            preflight-api.trivy.json \
            preflight-api-arm64.trivy.json \
            preflight-worker.trivy.json \
            preflight-worker-arm64.trivy.json \
            preflight-golden.trivy.json \
            preflight-golden-arm64.trivy.json \
            preflight-remote-golden.trivy.json \
            preflight-remote-golden-arm64.trivy.json \
            preflight-test-summary.json \
            packages/verification/migrations/0001_verification.sql \
            packages/verification/migrations/0002_materialization.sql \
            docs/DETERMINISTIC-VERIFICATION-0.3-MIGRATION.md \
            candidate-report.json \
            > preflight-checks.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: deterministic-verification-preflight-${{ env.RELEASE_COMMIT }}
          if-no-files-found: error
          retention-days: 90
          path: |
            verification-package-gate.json
            verification-package.cdx.json
            control-plane-package.cdx.json
            preflight-api-image.cdx.json
            preflight-api-arm64-image.cdx.json
            preflight-worker-image.cdx.json
            preflight-worker-arm64-image.cdx.json
            preflight-golden-image.cdx.json
            preflight-golden-arm64-image.cdx.json
            preflight-source.trivy.json
            preflight-api.trivy.json
            preflight-api-arm64.trivy.json
            preflight-worker.trivy.json
            preflight-worker-arm64.trivy.json
            preflight-golden.trivy.json
            preflight-golden-arm64.trivy.json
            preflight-remote-golden.trivy.json
            preflight-remote-golden-arm64.trivy.json
            preflight-test-summary.json
            packages/verification/migrations/0001_verification.sql
            packages/verification/migrations/0002_materialization.sql
            docs/DETERMINISTIC-VERIFICATION-0.3-MIGRATION.md
            preflight-checks.sha256
            candidate-report.json

  publish:
    name: publish one complete immutable release bundle
    needs: preflight
    if: startsWith(github.ref, 'refs/tags/') || (github.event_name == 'workflow_dispatch' && inputs.recover_immutable_0_3_0)
    runs-on: ubuntu-latest
    environment: deterministic-verification-release
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ inputs.recover_immutable_0_3_0 && env.RELEASE_TAG || github.ref }}
      - uses: actions/setup-node@v4
        with:
          node-version: "22.17.1"
          registry-url: https://registry.npmjs.org
          cache: npm
      - uses: docker/setup-buildx-action@v3
      - uses: docker/setup-qemu-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/download-artifact@v4
        with:
          name: deterministic-verification-preflight-${{ env.RELEASE_COMMIT }}
          path: release-assets
      - run: npm ci --ignore-scripts

      - name: Reverify preflight digests after environment approval
        run: (cd release-assets && sha256sum --check preflight-checks.sha256)

      - name: Rebuild and match exact publishable npm payloads
        run: |
          set -euo pipefail
          node scripts/verification-prepublish-gate.mjs > publish-package-gate.json
          cmp release-assets/verification-package-gate.json publish-package-gate.json

      - name: Resolve an existing API manifest for idempotent recovery
        id: api_existing
        env:
          REPOSITORY: ${{ env.API_REPOSITORY }}
        run: |
          set -euo pipefail
          version_ref="${REPOSITORY}:${VERSION}"
          commit_ref="${REPOSITORY}:sha-${RELEASE_COMMIT}"
          version_exists=false
          commit_exists=false
          if docker buildx imagetools inspect "$version_ref" --format '{{.Manifest.Digest}}' > version-digest.txt 2>/dev/null; then
            version_exists=true
          fi
          if docker buildx imagetools inspect "$commit_ref" --format '{{.Manifest.Digest}}' > commit-digest.txt 2>/dev/null; then
            commit_exists=true
          fi
          if [[ "$version_exists" == true && "$commit_exists" == false ]]; then
            digest="$(cat version-digest.txt)"
            docker buildx imagetools create --tag "$commit_ref" "${REPOSITORY}@${digest}"
            docker buildx imagetools inspect "$commit_ref" --format '{{.Manifest.Digest}}' > commit-digest.txt
            commit_exists=true
          elif [[ "$version_exists" == false && "$commit_exists" == true ]]; then
            digest="$(cat commit-digest.txt)"
            docker buildx imagetools create --tag "$version_ref" "${REPOSITORY}@${digest}"
            docker buildx imagetools inspect "$version_ref" --format '{{.Manifest.Digest}}' > version-digest.txt
            version_exists=true
          fi
          if [[ "$version_exists" == true ]]; then
            version_digest="$(cat version-digest.txt)"
            commit_digest="$(cat commit-digest.txt)"
            test "$version_digest" = "$commit_digest"
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "digest=$version_digest" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Build and publish immutable multi-architecture API image
        id: api
        if: steps.api_existing.outputs.exists != 'true'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: packages/verification/Dockerfile
          target: api
          platforms: linux/amd64,linux/arm64
          push: true
          sbom: true
          provenance: mode=max
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ env.RELEASE_COMMIT }}
            org.opencontainers.image.version=${{ env.VERSION }}
            org.opencontainers.image.licenses=Apache-2.0
          tags: |
            ${{ env.API_REPOSITORY }}:${{ env.VERSION }}
            ${{ env.API_REPOSITORY }}:sha-${{ env.RELEASE_COMMIT }}
      - name: Bind the immutable API manifest
        id: api_identity
        env:
          EXISTING_DIGEST: ${{ steps.api_existing.outputs.digest }}
          BUILT_DIGEST: ${{ steps.api.outputs.digest }}
        run: |
          set -euo pipefail
          digest="${EXISTING_DIGEST:-$BUILT_DIGEST}"
          test -n "$digest"
          echo "digest=$digest" >> "$GITHUB_OUTPUT"

      - name: Resolve an existing Worker manifest for idempotent recovery
        id: worker_existing
        env:
          REPOSITORY: ${{ env.WORKER_REPOSITORY }}
        run: |
          set -euo pipefail
          version_ref="${REPOSITORY}:${VERSION}"
          commit_ref="${REPOSITORY}:sha-${RELEASE_COMMIT}"
          version_exists=false
          commit_exists=false
          if docker buildx imagetools inspect "$version_ref" --format '{{.Manifest.Digest}}' > version-digest.txt 2>/dev/null; then version_exists=true; fi
          if docker buildx imagetools inspect "$commit_ref" --format '{{.Manifest.Digest}}' > commit-digest.txt 2>/dev/null; then commit_exists=true; fi
          if [[ "$version_exists" == true && "$commit_exists" == false ]]; then
            digest="$(cat version-digest.txt)"
            docker buildx imagetools create --tag "$commit_ref" "${REPOSITORY}@${digest}"
            docker buildx imagetools inspect "$commit_ref" --format '{{.Manifest.Digest}}' > commit-digest.txt
            commit_exists=true
          elif [[ "$version_exists" == false && "$commit_exists" == true ]]; then
            digest="$(cat commit-digest.txt)"
            docker buildx imagetools create --tag "$version_ref" "${REPOSITORY}@${digest}"
            docker buildx imagetools inspect "$version_ref" --format '{{.Manifest.Digest}}' > version-digest.txt
            version_exists=true
          fi
          if [[ "$version_exists" == true ]]; then
            version_digest="$(cat version-digest.txt)"
            commit_digest="$(cat commit-digest.txt)"
            test "$version_digest" = "$commit_digest"
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "digest=$version_digest" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Build and publish immutable multi-architecture Worker image
        id: worker
        if: steps.worker_existing.outputs.exists != 'true'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: packages/verification/Dockerfile
          target: worker
          platforms: linux/amd64,linux/arm64
          push: true
          sbom: true
          provenance: mode=max
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ env.RELEASE_COMMIT }}
            org.opencontainers.image.version=${{ env.VERSION }}
            org.opencontainers.image.licenses=Apache-2.0
          tags: |
            ${{ env.WORKER_REPOSITORY }}:${{ env.VERSION }}
            ${{ env.WORKER_REPOSITORY }}:sha-${{ env.RELEASE_COMMIT }}
      - name: Bind the immutable Worker manifest
        id: worker_identity
        env:
          EXISTING_DIGEST: ${{ steps.worker_existing.outputs.digest }}
          BUILT_DIGEST: ${{ steps.worker.outputs.digest }}
        run: |
          set -euo pipefail
          digest="${EXISTING_DIGEST:-$BUILT_DIGEST}"
          test -n "$digest"
          echo "digest=$digest" >> "$GITHUB_OUTPUT"

      - name: Resolve an existing Golden manifest for idempotent recovery
        id: profile_existing
        env:
          REPOSITORY: ${{ env.PROFILE_REPOSITORY }}
        run: |
          set -euo pipefail
          version_ref="${REPOSITORY}:${VERSION}"
          commit_ref="${REPOSITORY}:sha-${RELEASE_COMMIT}"
          version_exists=false
          commit_exists=false
          if docker buildx imagetools inspect "$version_ref" --format '{{.Manifest.Digest}}' > version-digest.txt 2>/dev/null; then version_exists=true; fi
          if docker buildx imagetools inspect "$commit_ref" --format '{{.Manifest.Digest}}' > commit-digest.txt 2>/dev/null; then commit_exists=true; fi
          if [[ "$version_exists" == true && "$commit_exists" == false ]]; then
            digest="$(cat version-digest.txt)"
            docker buildx imagetools create --tag "$commit_ref" "${REPOSITORY}@${digest}"
            docker buildx imagetools inspect "$commit_ref" --format '{{.Manifest.Digest}}' > commit-digest.txt
            commit_exists=true
          elif [[ "$version_exists" == false && "$commit_exists" == true ]]; then
            digest="$(cat commit-digest.txt)"
            docker buildx imagetools create --tag "$version_ref" "${REPOSITORY}@${digest}"
            docker buildx imagetools inspect "$version_ref" --format '{{.Manifest.Digest}}' > version-digest.txt
            version_exists=true
          fi
          if [[ "$version_exists" == true ]]; then
            version_digest="$(cat version-digest.txt)"
            commit_digest="$(cat commit-digest.txt)"
            test "$version_digest" = "$commit_digest"
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "digest=$version_digest" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Build and publish immutable multi-architecture remote Golden Stack sandbox
        id: profile
        if: steps.profile_existing.outputs.exists != 'true'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: packages/verification/Dockerfile.remote-sandbox
          platforms: linux/amd64,linux/arm64
          push: true
          sbom: true
          provenance: mode=max
          build-args: |
            REEF_VERIFICATION_API_IMAGE=${{ env.API_REPOSITORY }}@${{ steps.api_identity.outputs.digest }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ env.RELEASE_COMMIT }}
            org.opencontainers.image.version=${{ env.VERSION }}
            org.opencontainers.image.licenses=Apache-2.0
          tags: |
            ${{ env.PROFILE_REPOSITORY }}:${{ env.VERSION }}
            ${{ env.PROFILE_REPOSITORY }}:sha-${{ env.RELEASE_COMMIT }}
      - name: Bind the immutable Golden manifest
        id: profile_identity
        env:
          EXISTING_DIGEST: ${{ steps.profile_existing.outputs.digest }}
          BUILT_DIGEST: ${{ steps.profile.outputs.digest }}
        run: |
          set -euo pipefail
          digest="${EXISTING_DIGEST:-$BUILT_DIGEST}"
          test -n "$digest"
          echo "digest=$digest" >> "$GITHUB_OUTPUT"

      - name: Verify exact manifest platforms and capture platform digests
        env:
          API_DIGEST: ${{ steps.api_identity.outputs.digest }}
          WORKER_DIGEST: ${{ steps.worker_identity.outputs.digest }}
          PROFILE_DIGEST: ${{ steps.profile_identity.outputs.digest }}
        run: |
          set -euo pipefail
          for pair in \
            "api ${API_REPOSITORY} ${API_DIGEST}" \
            "worker ${WORKER_REPOSITORY} ${WORKER_DIGEST}" \
            "profile ${PROFILE_REPOSITORY} ${PROFILE_DIGEST}"; do
            set -- $pair
            component="$1" repository="$2" digest="$3"
            docker buildx imagetools inspect --raw "${repository}@${digest}" > "${component}-manifest.json"
            jq -e '
              ([.manifests[] | select(.platform.os == "linux" and .platform.architecture == "amd64")] | length) == 1 and
              ([.manifests[] | select(.platform.os == "linux" and .platform.architecture == "arm64")] | length) == 1 and
              ([.manifests[] | select(.annotations["vnd.docker.reference.type"] == "attestation-manifest")] | length) >= 2
            ' "${component}-manifest.json"
          done

      - name: Generate registry SBOMs
        uses: anchore/sbom-action@v0
        with:
          image: ${{ env.API_REPOSITORY }}@${{ steps.api_identity.outputs.digest }}
          format: cyclonedx-json
          output-file: api-image.cdx.json
      - name: Generate Worker registry SBOM
        uses: anchore/sbom-action@v0
        with:
          image: ${{ env.WORKER_REPOSITORY }}@${{ steps.worker_identity.outputs.digest }}
          format: cyclonedx-json
          output-file: worker-image.cdx.json
      - name: Generate Golden Stack sandbox registry SBOM
        uses: anchore/sbom-action@v0
        with:
          image: ${{ env.PROFILE_REPOSITORY }}@${{ steps.profile_identity.outputs.digest }}
          format: cyclonedx-json
          output-file: profile-image.cdx.json
      - name: Scan published content-addressed API image
        uses: aquasecurity/trivy-action@a9c7b0f06e461e9d4b4d1711f154ee024b8d7ab8 # v0.36.0
        with:
          image-ref: ${{ env.API_REPOSITORY }}@${{ steps.api_identity.outputs.digest }}
          scanners: vuln,secret
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          format: json
          output: api-image.trivy.json
          exit-code: "1"
      - name: Scan published content-addressed Worker image
        uses: aquasecurity/trivy-action@a9c7b0f06e461e9d4b4d1711f154ee024b8d7ab8 # v0.36.0
        with:
          image-ref: ${{ env.WORKER_REPOSITORY }}@${{ steps.worker_identity.outputs.digest }}
          scanners: vuln,secret
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          format: json
          output: worker-image.trivy.json
          exit-code: "1"
      - name: Scan published content-addressed Golden Stack sandbox
        uses: aquasecurity/trivy-action@a9c7b0f06e461e9d4b4d1711f154ee024b8d7ab8 # v0.36.0
        with:
          image-ref: ${{ env.PROFILE_REPOSITORY }}@${{ steps.profile_identity.outputs.digest }}
          scanners: vuln,secret
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          format: json
          output: profile-image.trivy.json
          exit-code: "1"

      - name: Generate the exact server-registered Golden Stack profile
        env:
          PROFILE_DIGEST: ${{ steps.profile_identity.outputs.digest }}
        run: |
          set -euo pipefail
          npm run build --workspace @octopus-reef/verification
          node scripts/write-verification-remote-profile.mjs "$PROFILE_DIGEST" golden-profile.json
          jq -e --arg digest "$PROFILE_DIGEST" '
            .ref == "verification-profile:golden-next-fastapi-postgres" and
            .version == "1.1.0" and
            .sandboxImageDigest == $digest and
            (.checks | length == 8) and
            (.checks | all(.[]; .required == true and .tool.imageDigest == $digest))
          ' golden-profile.json

      - name: Publish exact compatible npm packages with provenance
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          set -euo pipefail
          expected_verification_integrity="$(jq -r '.packages.verification.integrity' release-assets/verification-package-gate.json)"
          expected_control_integrity="$(jq -r '.packages.controlPlane.integrity' release-assets/verification-package-gate.json)"
          if npm view "@octopus-reef/verification@${VERSION}" --json > verification-existing.json 2>/dev/null; then
            test "$(jq -r '.gitHead' verification-existing.json)" = "$RELEASE_COMMIT"
            test "$(jq -r '.dist.integrity' verification-existing.json)" = "$expected_verification_integrity"
          else
            npm publish --provenance --access public --workspace @octopus-reef/verification
          fi
          if npm view "@octopus-reef/control-plane@${VERSION}" --json > control-plane-existing.json 2>/dev/null; then
            test "$(jq -r '.gitHead' control-plane-existing.json)" = "$RELEASE_COMMIT"
            test "$(jq -r '.dist.integrity' control-plane-existing.json)" = "$expected_control_integrity"
            test "$(jq -r '.dependencies[\"@octopus-reef/verification\"]' control-plane-existing.json)" = "$VERSION"
          else
            npm publish --provenance --access public --workspace @octopus-reef/control-plane
          fi

      - name: Verify public npm identities before finalizing the Release
        run: |
          set -euo pipefail
          wait_for_public_package() {
            local package_spec="$1"
            local output_path="$2"
            local attempt
            for attempt in $(seq 1 24); do
              if npm view "$package_spec" --json > "$output_path" 2>/dev/null &&
                jq -e --arg version "$VERSION" '.version == $version' "$output_path" >/dev/null; then
                return 0
              fi
              sleep 5
            done
            npm view "$package_spec" --json > "$output_path"
          }
          wait_for_public_package "@octopus-reef/verification@${VERSION}" verification-registry.json
          wait_for_public_package "@octopus-reef/control-plane@${VERSION}" control-plane-registry.json
          test "$(jq -r '.gitHead' verification-registry.json)" = "$RELEASE_COMMIT"
          test "$(jq -r '.gitHead' control-plane-registry.json)" = "$RELEASE_COMMIT"
          test "$(jq -r '.dependencies["@octopus-reef/verification"]' control-plane-registry.json)" = "$VERSION"
          test "$(jq -r '.dist.integrity' verification-registry.json)" = \
            "$(jq -r '.packages.verification.integrity' release-assets/verification-package-gate.json)"
          test "$(jq -r '.dist.integrity' control-plane-registry.json)" = \
            "$(jq -r '.packages.controlPlane.integrity' release-assets/verification-package-gate.json)"

      - name: Create the digest-bound release record
        env:
          API_DIGEST: ${{ steps.api_identity.outputs.digest }}
          WORKER_DIGEST: ${{ steps.worker_identity.outputs.digest }}
          PROFILE_DIGEST: ${{ steps.profile_identity.outputs.digest }}
        run: |
          set -euo pipefail
          migration_digest="$(jq -r '.migrationSetDigest' release-assets/verification-package-gate.json)"
          jq -e '
            .schemaHead == "0002_materialization" and
            (.migrationBindings | length == 2) and
            (.migrationBindings | all(.[]; .exactBytes == true))
          ' release-assets/verification-package-gate.json
          profile_ref="$(jq -r '.ref' golden-profile.json)"
          profile_version="$(jq -r '.version' golden-profile.json)"
          profile_digest="$(jq -r '.digest' golden-profile.json)"
          jq -n \
            --arg gitTag "$RELEASE_TAG" \
            --arg gitCommit "$RELEASE_COMMIT" \
            --arg publicationWorkflowCommit "$GITHUB_SHA" \
            --arg publicationRunId "$GITHUB_RUN_ID" \
            --arg recoveryMode "$RECOVERY_MODE" \
            --arg apiRepository "$API_REPOSITORY" \
            --arg apiDigest "$API_DIGEST" \
            --arg workerRepository "$WORKER_REPOSITORY" \
            --arg workerDigest "$WORKER_DIGEST" \
            --arg profileRepository "$PROFILE_REPOSITORY" \
            --arg profileImageDigest "$PROFILE_DIGEST" \
            --arg migrationSetDigest "$migration_digest" \
            --arg profileRef "$profile_ref" \
            --arg profileVersion "$profile_version" \
            --arg profileDigest "$profile_digest" \
            --slurpfile candidate release-assets/candidate-report.json \
            --slurpfile gate release-assets/verification-package-gate.json \
            --slurpfile control control-plane-registry.json \
            --slurpfile verification verification-registry.json \
            '{
              schemaVersion: "reef.verification-release.v2",
              package: {name: "@octopus-reef/control-plane", version: "0.3.0"},
              internalPackage: {name: "@octopus-reef/verification", version: "0.3.0"},
              gitTag: $gitTag,
              gitCommit: $gitCommit,
              publicationWorkflow: {
                workflowCommit: $publicationWorkflowCommit,
                runId: $publicationRunId,
                immutableTagRecovery: ($recoveryMode == "true"),
                recoveryInvariant: "the annotated tag, release commit, package payloads, and image source remain unchanged"
              },
              apiImage: {repository: $apiRepository, manifestDigest: $apiDigest},
              workerImage: {repository: $workerRepository, manifestDigest: $workerDigest},
              profileImage: {repository: $profileRepository, manifestDigest: $profileImageDigest},
              platforms: ["linux/amd64", "linux/arm64"],
              npm: {
                controlPlane: {
                  integrity: $control[0].dist.integrity,
                  shasum: $control[0].dist.shasum,
                  gitHead: $control[0].gitHead,
                  verificationDependency: $control[0].dependencies["@octopus-reef/verification"]
                },
                verification: {
                  integrity: $verification[0].dist.integrity,
                  shasum: $verification[0].dist.shasum,
                  gitHead: $verification[0].gitHead
                }
              },
              schemaHead: "0002_materialization",
              migrationSetDigest: $migrationSetDigest,
              migrationDigestAlgorithm: $gate[0].migrationDigestAlgorithm,
              migrationBindings: (
                $gate[0].migrationBindings |
                map(. + {releaseAsset: (.asset | split("/") | last)})
              ),
              materializationContract: {
                contractVersion: "1.0.0",
                requestSchema: "octopus.reef.external-materialization-request/v1",
                builderInventorySchema: "octopus.builder.source-bundle/v1",
                runtimeDescriptorSchema: "octopus.reef.materialization-descriptor/v1",
                publicIdentitySchema: "octopus.reef.materialization/v1",
                builderDigestCanonicalization: "lowercase sha256: plus octopus-evidence canonicalHash over the displayed Builder inventory fields excluding sourceBundleDigest",
                runtimeDescriptorCanonicalization: "lowercase sha256: plus octopus-evidence canonicalHash over the complete runtime descriptor excluding descriptorDigest",
                entryOrdering: "strict ascending UTF-8 path bytes",
                unicodeNormalization: "NFC",
                pathSemantics: "portable-nfc-casefold-v1 = NFC(lowercase(uppercase(NFC(path)))) using locale-independent ECMAScript casing",
                authoritativeSourceBundleDigest: "Builder-owned and candidate-bound",
                runtimeDescriptorDigest: "Reef-owned and attempt-bound",
                defaultLimits: {
                  maxFiles: 20000,
                  maxFileBytes: 16777216,
                  maxTotalBytes: 536870912,
                  maxPathBytes: 1024
                }
              },
              workloadAuthContract: {
                jwt: "offline deployment-owned JWKS; RS256 only",
                tenantBinding: "organisationRef exact and projectRef explicit membership",
                permissions: [
                  "verification:create",
                  "verification:read",
                  "verification:retry",
                  "verification:cancel",
                  "verification:evidence:read"
                ]
              },
              healthContract: {
                live: {path: "/health/live", response: {status: "live"}},
                ready: {path: "/health/ready", response: {status: "ready"}, dependency: "PostgreSQL schema head"},
                sandboxReady: {path: "/readyz", response: {ready: true, service: "reef-verification-sandbox"}}
              },
              profile: {ref: $profileRef, version: $profileVersion, digest: $profileDigest},
              typedClientContract: "/v1/verifications",
              evidenceContract: "octopus-evidence@0.2.0/store-untrusting",
              compatibilityPolicy: "DETERMINISTIC-VERIFICATION-0.3-MIGRATION.md",
              testSummary: "preflight-test-summary.json",
              scanEvidence: {
                prePublish: "preflight-*.trivy.json",
                published: ["api-image.trivy.json", "worker-image.trivy.json", "profile-image.trivy.json"],
                fixedHighCritical: 0,
                secrets: 0
              },
              provenance: {
                npm: "npm publish --provenance",
                oci: "BuildKit mode=max provenance and SBOM attestation manifests"
              },
              knownUnverified: $candidate[0].knownUnverified,
              status: "public-candidate-awaiting-detached-audit",
              candidateReport: $candidate[0],
              independentAudit: {
                required: true,
                binding: "sha256(release-bundle.sha256)"
              }
            }' > verification-release-record.json
          sha256sum verification-release-record.json > verification-release-record.sha256

      - name: Create immutable public prerelease awaiting registry/tag/digest black-box audit
        env:
          GH_TOKEN: ${{ github.token }}
          API_DIGEST: ${{ steps.api_identity.outputs.digest }}
          WORKER_DIGEST: ${{ steps.worker_identity.outputs.digest }}
          PROFILE_DIGEST: ${{ steps.profile_identity.outputs.digest }}
        run: |
          set -euo pipefail
          checks_digest="sha256:$(sha256sum verification-release-record.json | awk '{print $1}')"
          cat > release-notes.md <<EOF
          @octopus-reef/control-plane@${VERSION} deterministic Verification Run release.

          API image: ${API_REPOSITORY}@${API_DIGEST}
          Worker image: ${WORKER_REPOSITORY}@${WORKER_DIGEST}
          Golden Stack profile image: ${PROFILE_REPOSITORY}@${PROFILE_DIGEST}
          Release checks digest: ${checks_digest}

          Supported entrypoints: reef-verification migrate, reef-verification api,
          and reef-verification worker. Pin package, tag and images exactly; mutable
          tags and partial artifacts are not compatible release identities.

          This immutable public candidate includes canonical decimal cursors,
          store-untrusting Evidence identity binding, and the versioned external
          materialization Port. Status: READY FOR FRESH INDEPENDENT AUDIT.
          It is not a Builder GO decision.
          EOF
          cp release-assets/verification-package-gate.json .
          cp release-assets/verification-package.cdx.json .
          cp release-assets/control-plane-package.cdx.json .
          cp release-assets/candidate-report.json .
          cp release-assets/preflight-*.json .
          cp release-assets/packages/verification/migrations/0001_verification.sql .
          cp release-assets/packages/verification/migrations/0002_materialization.sql .
          cp release-assets/docs/DETERMINISTIC-VERIFICATION-0.3-MIGRATION.md .
          recovery="$(mktemp -d)"
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            asset_count="$(gh release view "$RELEASE_TAG" --json assets --jq '.assets | length')"
            if test "$asset_count" -gt 0; then
              gh release download "$RELEASE_TAG" --dir "$recovery"
            fi
            for existing in "$recovery"/*; do
              test -f "$existing" || continue
              name="$(basename "$existing")"
              case "$name" in
                release-bundle.sha256|release-bundle.sha256.sha256) ;;
                *) cp "$existing" "$name" ;;
              esac
            done
            if test -f verification-release-record.json; then
              test "$(jq -r '.gitCommit' verification-release-record.json)" = "$RELEASE_COMMIT"
            fi
          fi
          sha256sum --check verification-release-record.sha256
          sha256sum \
            verification-release-record.json \
            verification-release-record.sha256 \
            golden-profile.json \
            api-manifest.json worker-manifest.json profile-manifest.json \
            api-image.cdx.json worker-image.cdx.json profile-image.cdx.json \
            verification-registry.json control-plane-registry.json \
            verification-package-gate.json \
            verification-package.cdx.json \
            control-plane-package.cdx.json \
            preflight-api-image.cdx.json \
            preflight-api-arm64-image.cdx.json \
            preflight-worker-image.cdx.json \
            preflight-worker-arm64-image.cdx.json \
            preflight-golden-image.cdx.json \
            preflight-golden-arm64-image.cdx.json \
            preflight-source.trivy.json \
            preflight-api.trivy.json \
            preflight-api-arm64.trivy.json \
            preflight-worker.trivy.json \
            preflight-worker-arm64.trivy.json \
            preflight-golden.trivy.json \
            preflight-golden-arm64.trivy.json \
            preflight-remote-golden.trivy.json \
            preflight-remote-golden-arm64.trivy.json \
            api-image.trivy.json worker-image.trivy.json profile-image.trivy.json \
            preflight-test-summary.json \
            0001_verification.sql \
            0002_materialization.sql \
            DETERMINISTIC-VERIFICATION-0.3-MIGRATION.md \
            candidate-report.json \
            > release-bundle.sha256
          sha256sum release-bundle.sha256 > release-bundle.sha256.sha256
          if test -f "$recovery/release-bundle.sha256"; then
            cmp "$recovery/release-bundle.sha256" release-bundle.sha256
          fi
          if test -f "$recovery/release-bundle.sha256.sha256"; then
            cmp "$recovery/release-bundle.sha256.sha256" release-bundle.sha256.sha256
          fi
          if ! gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release create "$RELEASE_TAG" \
              --verify-tag \
              --prerelease \
              --title "@octopus-reef/control-plane ${VERSION} deterministic verification" \
              --notes-file release-notes.md
          fi
          assets=(
            verification-release-record.json
            verification-release-record.sha256
            golden-profile.json
            api-manifest.json worker-manifest.json profile-manifest.json
            api-image.cdx.json worker-image.cdx.json profile-image.cdx.json
            verification-registry.json control-plane-registry.json
            verification-package-gate.json
            verification-package.cdx.json control-plane-package.cdx.json
            preflight-api-image.cdx.json preflight-api-arm64-image.cdx.json
            preflight-worker-image.cdx.json preflight-worker-arm64-image.cdx.json
            preflight-golden-image.cdx.json preflight-golden-arm64-image.cdx.json
            preflight-source.trivy.json
            preflight-api.trivy.json preflight-api-arm64.trivy.json
            preflight-worker.trivy.json preflight-worker-arm64.trivy.json
            preflight-golden.trivy.json preflight-golden-arm64.trivy.json
            preflight-remote-golden.trivy.json preflight-remote-golden-arm64.trivy.json
            api-image.trivy.json worker-image.trivy.json profile-image.trivy.json
            preflight-test-summary.json
            0001_verification.sql 0002_materialization.sql
            DETERMINISTIC-VERIFICATION-0.3-MIGRATION.md
            candidate-report.json
            release-bundle.sha256 release-bundle.sha256.sha256
          )
          for asset in "${assets[@]}"; do
            if ! gh release view "$RELEASE_TAG" --json assets --jq '.assets[].name' | grep -Fx "$asset" >/dev/null; then
              gh release upload "$RELEASE_TAG" "$asset"
            fi
          done

      - name: Prove the candidate bundle is anonymously public
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release view "$RELEASE_TAG" \
            --json isDraft,isPrerelease \
            --jq 'select(.isDraft == false and .isPrerelease == true)'
          anonymous="$(mktemp -d)"
          trap 'rm -rf "$anonymous"' EXIT
          curl --fail --silent --show-error \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/releases/tags/${RELEASE_TAG}" \
            > "$anonymous/release.json"
          jq -r '.assets[].browser_download_url' "$anonymous/release.json" |
            while IFS= read -r url; do
              curl --fail --silent --show-error --location \
                --output "$anonymous/$(basename "$url")" \
                "$url"
            done
          (cd "$anonymous" && sha256sum --check release-bundle.sha256.sha256)
          (cd "$anonymous" && sha256sum --check release-bundle.sha256)
